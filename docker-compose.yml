# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.13.0
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --config
      - _config.yml,_config.dev.yml
      - --watch
      - --incremental
      - --livereload
      - --force_polling
      - --host=0.0.0.0
      - --port=8080
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
